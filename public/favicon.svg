<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 512 512">
  <!-- DistroTrack Favicon: Delivery Truck with Boxes -->
  <!-- Background: transparent -->
  
  <!-- Speed lines -->
  <g stroke="#3D4B6E" stroke-width="12" stroke-linecap="round" opacity="0.6">
    <line x1="20" y1="140" x2="80" y2="140"/>
    <line x1="10" y1="175" x2="90" y2="175"/>
    <line x1="20" y1="210" x2="80" y2="210"/>
    <line x1="30" y1="245" x2="70" y2="245"/>
  </g>

  <!-- Truck bed / platform -->
  <rect x="70" y="280" width="330" height="30" rx="4" fill="#E8963A"/>
  
  <!-- Truck cargo area (dark navy) -->
  <rect x="80" y="100" width="280" height="185" rx="8" fill="#3D4B6E"/>
  
  <!-- Truck cab (yellow) -->
  <path d="M360 150 L360 310 L460 310 L460 200 Q460 160 430 150 Z" fill="#F5C542"/>
  <!-- Cab window -->
  <path d="M375 165 L430 165 Q445 170 450 200 L450 230 L375 230 Z" fill="#E8F4FD" opacity="0.9"/>
  <!-- Window frame -->
  <path d="M375 165 L430 165 Q445 170 450 200 L450 230 L375 230 Z" fill="none" stroke="#2D3A54" stroke-width="5"/>
  
  <!-- Cab bumper -->
  <rect x="450" y="270" width="30" height="40" rx="6" fill="#E8963A"/>
  
  <!-- Boxes - Bottom Row -->
  <!-- Box 1 (bottom left) -->
  <rect x="100" y="195" width="80" height="80" rx="4" fill="#D4B98C"/>
  <rect x="125" y="195" width="30" height="12" rx="2" fill="#3B7DD8"/>
  <!-- Box 2 (bottom center) -->
  <rect x="190" y="195" width="80" height="80" rx="4" fill="#D4B98C"/>
  <rect x="215" y="195" width="30" height="12" rx="2" fill="#E05555"/>
  <!-- Box 3 (bottom right) -->
  <rect x="280" y="195" width="65" height="80" rx="4" fill="#D4B98C"/>
  <rect x="298" y="195" width="30" height="12" rx="2" fill="#3B7DD8"/>

  <!-- Boxes - Top Row -->
  <!-- Box 4 (top left) -->
  <rect x="120" y="120" width="90" height="70" rx="4" fill="#C4A06A"/>
  <rect x="150" y="120" width="30" height="12" rx="2" fill="#2DA84F"/>
  <!-- Box 5 (top right) -->
  <rect x="220" y="120" width="90" height="70" rx="4" fill="#D4B98C"/>
  <rect x="250" y="120" width="30" height="12" rx="2" fill="#3B7DD8"/>

  <!-- Truck undercarriage -->
  <rect x="70" y="310" width="420" height="20" rx="4" fill="#2D3A54"/>
  
  <!-- Wheels -->
  <!-- Rear wheel -->
  <circle cx="165" cy="345" r="42" fill="#2D3A54"/>
  <circle cx="165" cy="345" r="28" fill="#555"/>
  <circle cx="165" cy="345" r="14" fill="#F5C542"/>
  <!-- Front wheel -->
  <circle cx="400" cy="345" r="42" fill="#2D3A54"/>
  <circle cx="400" cy="345" r="28" fill="#555"/>
  <circle cx="400" cy="345" r="14" fill="#F5C542"/>
  
  <!-- Headlight -->
  <rect x="458" y="240" width="18" height="22" rx="4" fill="#F5E663"/>
</svg>